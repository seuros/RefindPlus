[env]
EDK2_WORKSPACE = "{{config_root}}/edk2"

[tasks.build]
description = "Build Meridian (debug)"
run = "./scripts/build.sh --target DEBUG"

[tasks.release]
description = "Build Meridian (release)"
run = "./scripts/build.sh --target RELEASE"

[tasks.build-arm]
description = "Build Meridian for AArch64 (debug)"
run = "./scripts/build.sh --arch AARCH64 --target DEBUG"

[tasks.release-arm]
description = "Build Meridian for AArch64 (release)"
run = "./scripts/build.sh --arch AARCH64 --target RELEASE"

[tasks.package]
description = "Package the X64 release build into dist/"
run = "./scripts/package-release.sh --arch X64 --target RELEASE --version $(tr -d '[:space:]' < version.txt)"

[tasks.package-arm]
description = "Package the AArch64 release build into dist/"
run = "./scripts/package-release.sh --arch AARCH64 --target RELEASE --version $(tr -d '[:space:]' < version.txt)"

[tasks.calver]
description = "Print the next CalVer version"
run = "./scripts/calver.sh"

[tasks.release-prepare]
description = "Pin the next CalVer with an empty Release-As commit, then push to open the release PR"
run = "./scripts/calver.sh --commit"

[tasks.test]
description = "Run the Conn engine unit tests and the golden-image regression"
run = "make -C conn test"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf edk2/Build/Meridian"

[tasks.submodules]
description = "Initialize EDK2 submodule"
run = "git submodule update --init --recursive"

# The symlink lives inside the edk2 work tree and is untracked, so a fresh
# checkout has no build workspace until this runs. -n stops a rerun from
# creating edk2/MeridianPkg/MeridianPkg.
[tasks.workspace]
description = "Link this checkout into the EDK2 workspace as MeridianPkg"
run = "ln -sfn .. edk2/MeridianPkg && ls -ld edk2/MeridianPkg"

[tasks.lint]
description = "Check REUSE compliance"
run = "reuse lint"

[tasks.precommit]
description = "Run pre-commit hooks against staged changes"
run = "pre-commit run"

[tasks.precommit-install]
description = "Install Git pre-commit hooks"
run = "pre-commit install"

[tasks.tidy-staged]
description = "Run clang-tidy against staged C changes"
run = "./scripts/clang-tidy.sh --staged"

[tasks.smoke-mac]
description = "Boot Meridian under QEMU/Q35 with Apple SMBIOS + e1000 NIC"
run = "./scripts/qemu-mac-smoke.sh"

[tasks.smoke-arm]
description = "Boot Meridian under QEMU ArmVirt (AArch64 smoke)"
run = "./scripts/qemu-aarch64-smoke.sh"

[tasks.check]
description = "Run all repository health checks (REUSE, INF sources, DSC components, stale refs)"
run = "./scripts/check.sh"

[tools]
python = "3"
clang = "22.1.8"
"conda:lld" = "22.1.8"
"conda:llvm-tools" = "22.1.8"
# uv backs the pipx: tools below; without it mise has no installer for them.
uv = "latest"
"pipx:reuse" = "latest"
"pipx:pre-commit" = "latest"
