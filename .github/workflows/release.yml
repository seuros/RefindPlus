name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to re-attach artifacts to (e.g. v2026.9.0).
          Leave empty to build and package both architectures without
          publishing anything.
        required: false
        type: string

permissions:
  contents: read

jobs:
  # No release-type input: config-file mode is what makes extra-files work.
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    if: github.repository == 'seuros/meridian' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Gated on the release-please output from THIS run: a release created with
  # GITHUB_TOKEN starts no new runs, so `on: release` would never fire.
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: release-please
    if: >-
      !cancelled() && github.repository == 'seuros/meridian' &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        arch: [X64, AARCH64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # BaseTools builds its brotli; build.py validates the include paths
      # MdeModulePkg.dec and MdePkg.dec declare inside the other two. Not
      # --recursive: that drags in openssl, mbedtls and libspdm for nothing.
      - name: Fetch build submodules
        run: |
          git submodule update --init --depth 1 edk2 libstatemachines
          git -C edk2 submodule update --init --depth 1 \
            BaseTools/Source/C/BrotliCompress/brotli \
            MdeModulePkg/Library/BrotliCustomDecompressLib/brotli \
            MdePkg/Library/MipiSysTLib/mipisyst

      # Untracked (it lives in the edk2 work tree), so recreate it every time.
      # -n keeps a rerun from creating edk2/MeridianPkg/MeridianPkg.
      - name: Link the package into the EDK2 workspace
        run: ln -sfn .. edk2/MeridianPkg

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev nasm acpica-tools \
            python3 python3-setuptools zip

      - name: Cache BaseTools
        uses: actions/cache@v4
        with:
          path: edk2/BaseTools/Source/C/bin
          key: basetools-${{ runner.os }}-${{ hashFiles('.gitmodules') }}

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ needs.release-please.outputs.version }}" ]; then
            version='${{ needs.release-please.outputs.version }}'
          else
            version="$(tr -d '[:space:]' < version.txt)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Packaging as ${version}"

      - name: Build
        run: ./scripts/build.sh --arch ${{ matrix.arch }} --target RELEASE

      - name: Package
        run: |
          ./scripts/package-release.sh \
            --arch ${{ matrix.arch }} \
            --target RELEASE \
            --version '${{ steps.version.outputs.version }}' \
            --out dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach to release
    runs-on: ubuntu-latest
    needs: [release-please, build]
    if: >-
      !cancelled() && github.repository == 'seuros/meridian' &&
      needs.build.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
       inputs.tag != '')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: meridian-*
          path: dist
          merge-multiple: true

      # Concatenate rather than recompute: each half came from the runner that
      # built those binaries.
      - name: Merge checksums
        run: |
          cd dist
          cat SHA256SUMS.x64 SHA256SUMS.aarch64 > SHA256SUMS
          rm -f SHA256SUMS.x64 SHA256SUMS.aarch64
          ls -la

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
