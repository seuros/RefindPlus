name: Tests

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conn:
    name: Conn Engine
    runs-on: ubuntu-latest
    steps:
      # Bare owner/repo, never a full URL: GitHub reads a https:// ref as a
      # repository with that literal name and fails before any step runs.
      # Gitea and Forgejo resolve bare names against DEFAULT_ACTIONS_URL,
      # which points at github.com unless a runner was told otherwise.
      - name: Check out repository
        uses: actions/checkout@v4

      # The engine compiles against the real MdePkg headers, so EDK2 is a
      # build input even for a host test. Shallow, and neither submodule needs
      # its own submodules.
      - name: Fetch header and state-machine submodules
        run: git submodule update --init --depth 1 edk2 libstatemachines

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Run tests
        run: mise run test
