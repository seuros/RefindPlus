name: Checks

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository Checks
    runs-on: ubuntu-latest
    steps:
      # Bare owner/repo, never a full URL: GitHub reads a https:// ref as a
      # repository with that literal name and fails before any step runs.
      # Gitea and Forgejo resolve bare names against DEFAULT_ACTIONS_URL,
      # which points at github.com unless a runner was told otherwise.
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Run checks
        run: mise run check

      - name: Validate build wrapper
        run: |
          mkdir -p /tmp/meridian-edk2
          ln -s "${GITHUB_WORKSPACE}" /tmp/meridian-edk2/MeridianPkg
          ./scripts/build.sh --workspace /tmp/meridian-edk2 --dry-run
